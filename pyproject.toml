[project]
name = "scoped-drive-mcp"
version = "0.1.0"
description = "MCP server that gives AI assistants only the Google Drive files you allow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.30,<2",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "pydantic-settings>=2.6",
    "starlette>=0.40",
    "uvicorn>=0.32",
    "upstash-redis>=1.9.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.33",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=7.1.1",
    "openpyxl>=3.1.5",
    "olefile>=0.47",
    "striprtf>=0.0.35",
    "defusedxml>=0.7.1",
    "vercel-blob>=0.6.2",
    # Imported directly (the botrbac CLI, Notion and OneDrive clients, webhooks).
    "httpx>=0.27",
]

[project.scripts]
botrbac = "botrbac_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoped_drive_mcp", "src/botrbac_cli"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
