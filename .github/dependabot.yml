# Update pull requests for everything that is pinned: the SHA-pinned actions, uv.lock and
# the Node signer's one dependency. Grouped, so a week is one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # mcp 2.x renamed FastMCP to MCPServer and changed other APIs; the server is written
    # for 1.x (pyproject pins mcp<2). Moving to 2.x is its own piece of work, not a bump.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node:
        patterns: ["*"]
