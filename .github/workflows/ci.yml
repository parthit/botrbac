name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date, and use its exact ruff and pytest.
      # Different ruff versions format differently; that is how main drifted before.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      # Vercel installs from requirements.txt, not uv.lock. Fail if they drifted.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt

      # The Node function that signs Blob URLs (api/blob-sign.mjs), with the runner's Node.
      - name: Node signer
        run: |
          npm ci --ignore-scripts
          node --check api/blob-sign.mjs
          node --check src/scoped_drive_mcp/templates/ui.js
          npm test
