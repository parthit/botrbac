name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real servers for tests/test_store_backends.py: the production backends' SQL and Lua
    # run against the same contract as the in-memory store the rest of the suite uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date, and use its exact ruff and pytest.
      # Different ruff versions format differently; that is how main drifted before.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          TEST_REDIS_URL: redis://127.0.0.1:6379

      # Vercel installs from requirements.txt, not uv.lock. Fail if they drifted.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt

      # The Node function that signs Blob URLs (api/blob-sign.mjs), on the Node that
      # package.json's `engines` asks Vercel for.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Node signer
        run: |
          npm ci --ignore-scripts
          node --check api/blob-sign.mjs
          node --check src/scoped_drive_mcp/templates/ui.js
          npm test
